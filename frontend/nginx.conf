server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location ~ ^/(workforce|legacy-import|domains|reports|recruitment|employee-portal|performance|access|auth|companies|branches|departments|job-titles|document-categories|leave-types|public-holidays|leave-balances|leave-requests|documents|employees|lifecycle|audit-logs|attendance|payroll|deduction-types|benefit-types|countries|platform|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-store" always; }
    location = /sw.js { add_header Cache-Control "no-store" always; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
}
